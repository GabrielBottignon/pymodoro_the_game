<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pymodoro - Login</title>
    <!-- Latest compiled and minified CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css"
      integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <section>
      <form>
        <!-- Entrada para e-mail do usuário -->
        <div class="form-outline mb-4">
          <label class="form-label" for="form-email">Endereço de e-mail</label>

          <input
            type="email"
            id="form-email"
            class="form-control"
            placeholder="example@example.com"
            required
          />
        </div>
        <!-- Entrada para senha do usuário -->
        <div class="form-outline mb-4">
          <label class="form-label" for="form-password">Senha registrada</label>

          <input
            type="password"
            id="form-password"
            class="form-control"
            placeholder="************"
            required
          />
        </div>
        <!-- Hiperlink para recuperação de senha -->
        <div class="col">
          <a href="#!">Esqueceu sua senha?</a>
        </div>
        <!--Hiperlink de direcionamento para registrar conta -->
        <div class="col">
          <p>Não tem conta? <a href="#!">Registre-se.</a></p>
        </div>
        <!-- Botão para confirmar e realizar login -->
        <button type="submit" class="btn btn-primary">Acessar</button>
      </form>
    </section>
    <!-- Latest compiled and minified JavaScript -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/js/bootstrap.min.js"
      integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
